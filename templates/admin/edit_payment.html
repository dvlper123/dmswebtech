{% extends 'admin/base.html' %}

{% block title %}Edit Payment - Admin Panel{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-gradient" style="background: linear-gradient(135deg, var(--primary-green), var(--light-green));">
        <h3 class="mb-0" style="color: var(--white);">
            <i class="fas fa-edit me-2"></i>Edit Payment
        </h3>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="client" class="form-label">Client <span class="text-danger">*</span></label>
                    <select class="form-control" id="client" name="client" required>
                        {% for client in clients %}
                        <option value="{{ client.id }}" {% if client.id == payment.client.id %}selected{% endif %}>{{ client.client_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="invoice_number" class="form-label">Invoice Number <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="invoice_number" name="invoice_number" value="{{ payment.invoice_number }}" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="amount" class="form-label">Amount <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" class="form-control" id="amount" name="amount" value="{{ payment.amount }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="payment_date" class="form-label">Payment Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="payment_date" name="payment_date" value="{{ payment.payment_date|date:'Y-m-d' }}" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="payment_method" class="form-label">Payment Method <span class="text-danger">*</span></label>
                    <select class="form-control" id="payment_method" name="payment_method" required>
                        <option value="cash" {% if payment.payment_method == 'cash' %}selected{% endif %}>Cash</option>
                        <option value="cheque" {% if payment.payment_method == 'cheque' %}selected{% endif %}>Cheque</option>
                        <option value="online" {% if payment.payment_method == 'online' %}selected{% endif %}>Online Transfer</option>
                        <option value="card" {% if payment.payment_method == 'card' %}selected{% endif %}>Credit/Debit Card</option>
                        <option value="upi" {% if payment.payment_method == 'upi' %}selected{% endif %}>UPI</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                    <select class="form-control" id="status" name="status" required>
                        <option value="pending" {% if payment.status == 'pending' %}selected{% endif %}>Pending</option>
                        <option value="completed" {% if payment.status == 'completed' %}selected{% endif %}>Completed</option>
                        <option value="failed" {% if payment.status == 'failed' %}selected{% endif %}>Failed</option>
                        <option value="cancelled" {% if payment.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="reference_number" class="form-label">Reference Number</label>
                    <input type="text" class="form-control" id="reference_number" name="reference_number" value="{{ payment.reference_number|default:'' }}">
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ payment.description|default:'' }}</textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>Update Payment
                </button>
                <a href="{% url 'view_payments' %}" class="btn btn-secondary">
                    <i class="fas fa-times me-1"></i>Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
