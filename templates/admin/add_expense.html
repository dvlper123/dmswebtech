{% extends 'admin/base.html' %}

{% block title %}Add Expense - Admin Panel{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-gradient" style="background: linear-gradient(135deg, var(--primary-green), var(--light-green));">
        <h3 class="mb-0" style="color: var(--white);">
            <i class="fas fa-plus-circle me-2"></i>Add Expense
        </h3>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                    <select class="form-control" id="category" name="category" required>
                        <option value="">Select Category</option>
                        {% for value, label in expense_categories %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="description" name="description" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="amount" class="form-label">Amount <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="expense_date" class="form-label">Expense Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="expense_date" name="expense_date" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="payment_method" class="form-label">Payment Method</label>
                    <input type="text" class="form-control" id="payment_method" name="payment_method" placeholder="e.g., Cash, Cheque, Online">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="reference_number" class="form-label">Reference Number</label>
                    <input type="text" class="form-control" id="reference_number" name="reference_number">
                </div>
            </div>

            <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>Add Expense
                </button>
                <a href="{% url 'admin_expenses' %}" class="btn btn-secondary">
                    <i class="fas fa-times me-1"></i>Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
